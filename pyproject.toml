[project]
name = "markets-trending-to-bluesky"
version = "0.1.0"
description = "A bot to fetch market indicators, summarize trends, and post them to Bluesky"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "atproto>=0.0.69",
    "beautifulsoup4",
    "dnspython",
    "google-genai",
    "packaging",
    "Pillow",
    "requests",
    "python-dotenv",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[tool.uv]
override-dependencies = [
    "cryptography>=50.0.0",
]
exclude-newer = "7 days"
