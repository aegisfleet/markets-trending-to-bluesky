name: スクリプトを実行する(日経)

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '0 11 * * 1-5'

jobs:
  run_script:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: '3.10'

      - name: 依存関係のインストール
        run: uv sync --frozen

      - name: リポジトリ内のPythonファイルを実行
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python main.py "${BLUESKY_HANDLE}" "${BLUESKY_PASSWORD}" "${GEMINI_API_KEY}" nikkei
